<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لعبة تركيب الصورة 🌸</title>
<style>
  :root{
    --pink1:#ffd6e8;
    --pink2:#ffb6d9;
    --pink3:#ff8fc1;
    --white:#fffafc;
    --text:#7a3b57;
  }
  html,body{
    height:100%;
    margin:0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    background:linear-gradient(180deg,var(--white) 0%,var(--pink1) 40%,var(--pink2) 100%);
    font-family:'Tahoma','Segoe UI',sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    min-height:100%;
    overflow-x:hidden;
    position:relative;
    padding-bottom:40px;
  }

  h1{
    color:var(--text);
    font-size:1.5rem;
    margin:20px 0 6px;
    text-shadow:0 1px 2px rgba(255,255,255,.8);
    z-index:5;
    text-align:center;
  }

  .hint{
    color:var(--text);
    opacity:.8;
    font-size:.95rem;
    margin-bottom:14px;
    z-index:5;
    text-align:center;
    padding:0 20px;
  }

  .screen{
    z-index:5;
    width:100%;
    max-width:360px;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:0 16px;
  }

  /* choose screen */
  .choice-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    width:100%;
    margin-top:10px;
  }
  .choice-card{
    background:linear-gradient(160deg,#fff,var(--pink1));
    border:none;
    border-radius:18px;
    padding:22px 10px;
    font-size:1.2rem;
    font-weight:bold;
    color:var(--pink3);
    box-shadow:0 8px 20px rgba(255,140,190,.35), 0 0 0 4px rgba(255,255,255,.6) inset;
    cursor:pointer;
    transition:transform .15s ease;
  }
  .choice-card:active{ transform:scale(.94); }

  /* game screen */
  .timer{
    font-size:2rem;
    font-weight:bold;
    color:var(--pink3);
    margin:6px 0 14px;
    font-variant-numeric:tabular-nums;
  }

  .puzzle{
    direction:ltr;
    width:312px;
    height:592px;
    display:grid;
    grid-template-columns:repeat(4, 75px);
    grid-template-rows:repeat(4, 146.25px);
    gap:1px;
    background:#fff;
    border-radius:16px;
    padding:4px;
    box-shadow:0 10px 26px rgba(255,140,190,.4);
    margin-bottom:18px;
  }
  .piece{
    width:75px;
    height:146.25px;
    background-image:var(--puzzle-img);
    background-size:300px 585px;
    border:none;
    border-radius:4px;
    cursor:pointer;
    box-shadow:0 0 0 1px rgba(255,255,255,.7) inset;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .piece.selected{
    box-shadow:0 0 0 3px var(--pink3) inset;
    transform:scale(.94);
  }
  .piece.correct{
    box-shadow:0 0 0 2px #6fcf97 inset;
  }
  .piece.selected.correct{
    box-shadow:0 0 0 3px var(--pink3) inset, 0 0 0 2px #6fcf97 inset;
  }

  .row-btns{
    display:flex;
    gap:10px;
    margin-top:4px;
  }

  .btn{
    padding:10px 24px;
    border:none;
    border-radius:30px;
    background:linear-gradient(135deg,var(--pink3),var(--pink2));
    color:#fff;
    font-size:.95rem;
    font-weight:bold;
    box-shadow:0 6px 16px rgba(255,140,190,.5);
    cursor:pointer;
    transition:transform .15s ease;
  }
  .btn.secondary{
    background:#fff;
    color:var(--pink3);
    border:2px solid var(--pink3);
  }
  .btn:active{ transform:scale(.95); }

  .feedback{
    font-size:1.2rem;
    font-weight:bold;
    min-height:1.6em;
    text-align:center;
    margin:10px 0;
  }
  .feedback.win{ color:#e0559a; }

  .result-time{
    font-size:2.4rem;
    font-weight:bold;
    color:var(--pink3);
    margin:10px 0;
  }

  .reveal-img{
    width:180px;
    height:351px;
    background-image:var(--puzzle-img);
    background-size:180px 351px;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(255,140,190,.4);
    margin:10px 0;
  }

  .hidden{ display:none !important; }

  /* sakura petals */
  .petal{
    position:fixed;
    top:-10%;
    pointer-events:none;
    z-index:1;
    opacity:.85;
    animation-name:fall;
    animation-timing-function:linear;
    animation-iteration-count:infinite;
  }
  @keyframes fall{
    0%{ transform:translate(0,0) rotate(0deg); }
    100%{ transform:translate(var(--drift),120vh) rotate(360deg); }
  }
</style>
</head>
<body>

<h1>🌸 لعبة تركيب الصورة 🌸</h1>

<!-- SCREEN 1: choose player name -->
<div class="screen" id="chooseScreen">
  <div class="hint">اختاري اسمك اللاعبة أولاً</div>
  <div class="choice-grid" id="choiceGrid"></div>
</div>

<!-- SCREEN 2: image puzzle with stopwatch -->
<div class="screen hidden" id="gameScreen">
  <div class="hint" id="gameHint"></div>
  <div class="timer" id="timer">0.0</div>
  <div class="puzzle" id="puzzle"></div>
  <div class="row-btns">
    <button class="btn secondary" id="shuffleBtn">تخليط جديد</button>
  </div>
</div>

<!-- SCREEN 3: result -->
<div class="screen hidden" id="resultScreen">
  <div class="feedback win" id="resultName"></div>
  <div class="reveal-img"></div>
  <div class="hint">وقت حل الصورة</div>
  <div class="result-time" id="resultTime"></div>
  <button class="btn" id="playAgainBtn">لعبة جديدة 🎀</button>
</div>

  document.documentElement.style.setProperty('--puzzle-img', puzzleImgUrl);

  const GRID = 4;
  const TILE_W = 75;
  const TILE_H = 146.25;

  const chooseScreen = document.getElementById('chooseScreen');
  const gameScreen = document.getElementById('gameScreen');
  const resultScreen = document.getElementById('resultScreen');
  const choiceGrid = document.getElementById('choiceGrid');
  const gameHint = document.getElementById('gameHint');
  const timerEl = document.getElementById('timer');
  const puzzleEl = document.getElementById('puzzle');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const resultName = document.getElementById('resultName');
  const resultTime = document.getElementById('resultTime');
  const playAgainBtn = document.getElementById('playAgainBtn');

  let playerName = '';
  let order = [];          // order[gridPos] = correctIndex of the piece sitting there
  let selectedPos = null;
  let startTime = 0;
  let stopwatchHandle = null;
  let solvedHandled = false;

  options.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'choice-card';
    btn.textContent = name;
    btn.addEventListener('click', () => {
      playerName = name;
      startGame();
    });
    choiceGrid.appendChild(btn);
  });

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function isSolved(){
    return order.every((val, idx) => val === idx);
  }

  function newShuffledOrder(){
    let arr;
    do {
      arr = shuffle([...Array(GRID*GRID).keys()]);
    } while (arr.every((val, idx) => val === idx));
    return arr;
  }

  function startGame(){
    chooseScreen.classList.add('hidden');
    resultScreen.classList.add('hidden');
    gameScreen.classList.remove('hidden');
    gameHint.textContent = `يا ${playerName}، ركّبي الصورة! الحد الأخضر = القطعة بمكانها الصحيح`;

    order = newShuffledOrder();
    selectedPos = null;
    solvedHandled = false;
    renderPuzzle();

    startTime = performance.now();
    timerEl.textContent = '0.0';
    clearInterval(stopwatchHandle);
    stopwatchHandle = setInterval(() => {
      const elapsed = (performance.now() - startTime) / 1000;
      timerEl.textContent = elapsed.toFixed(1);

      // safety net: check every tick too, not just right after a swap,
      // so the stopwatch can never keep running once it's actually solved
      if(!solvedHandled && isSolved()){
        solvedHandled = true;
        clearInterval(stopwatchHandle);
        finishGame();
      }
    }, 100);
  }

  function renderPuzzle(){
    puzzleEl.innerHTML = '';
    order.forEach((correctIndex, pos) => {
      const row = Math.floor(correctIndex / GRID);
      const col = correctIndex % GRID;
      const piece = document.createElement('button');
      piece.className = 'piece' + (correctIndex === pos ? ' correct' : '');
      piece.style.backgroundPosition = `-${col * TILE_W}px -${row * TILE_H}px`;
      piece.dataset.pos = pos;
      piece.addEventListener('click', () => handlePieceClick(pos));
      puzzleEl.appendChild(piece);
    });

    // check immediately every time the grid changes, so the stopwatch
    // stops on the exact render where the picture becomes correct
    if(!solvedHandled && isSolved()){
      solvedHandled = true;
      clearInterval(stopwatchHandle);
      finishGame();
    }
  }

  function handlePieceClick(pos){
    if(solvedHandled) return;
    if(selectedPos === null){
      selectedPos = pos;
      puzzleEl.children[pos].classList.add('selected');
      return;
    }
    if(selectedPos === pos){
      puzzleEl.children[pos].classList.remove('selected');
      selectedPos = null;
      return;
    }
    // swap
    [order[selectedPos], order[pos]] = [order[pos], order[selectedPos]];
    puzzleEl.children[selectedPos].classList.remove('selected');
    selectedPos = null;
    renderPuzzle();
  }

  shuffleBtn.addEventListener('click', () => {
    order = newShuffledOrder();
    selectedPos = null;
    solvedHandled = false;
    renderPuzzle();
  });

  function finishGame(){
    const finalTime = ((performance.now() - startTime) / 1000).toFixed(1);
    gameScreen.classList.add('hidden');
    resultScreen.classList.remove('hidden');
    resultName.textContent = `🎉 برافو يا ${playerName}!`;
    resultTime.textContent = `${finalTime} ثانية`;
  }

  playAgainBtn.addEventListener('click', () => {
    resultScreen.classList.add('hidden');
    chooseScreen.classList.remove('hidden');
  });

  // sakura petals background
  const petalCount = 18;
  for(let i=0;i<petalCount;i++){
    const petal = document.createElement('div');
    petal.className = 'petal';
    const size = 10 + Math.random()*14;
    petal.style.left = Math.random()*100 + 'vw';
    petal.style.width = size + 'px';
    petal.style.height = size + 'px';
    petal.style.setProperty('--drift', (Math.random()*100-50) + 'px');
    petal.style.animationDuration = (6 + Math.random()*8) + 's';
    petal.style.animationDelay = (Math.random()*8) + 's';
    petal.innerHTML = `<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 2 C20 8 26 10 30 16 C26 22 20 24 16 30 C12 24 6 22 2 16 C6 10 12 8 16 2 Z" fill="#ffb6d9" opacity="0.85"/>
    </svg>`;
    document.body.appendChild(petal);
  }
</script>
